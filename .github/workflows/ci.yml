# In this file we created the CI GitHub Actions workflow for our project.
# It runs tests for both the backend and frontend whenever there is a push or pull request to the GitHub repository.

#  ci.yml
#   → push + pull_request
#   → backend tests
#   → Vitest
#   → frontend build
#   → no sensitive credentials

name: CI

on:
  push:
  pull_request:

jobs:

  backend:
    name: Backend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Run backend tests
        run: ./mvnw test # Here's where we run the backend tests such as unit tests and integration tests.


  frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test -- --run # Here's where we run the frontend tests such as unit tests and integration tests.

      - name: Build frontend
        env:
          VITE_API_BASE_URL: http://localhost:8080/api
          VITE_KEYCLOAK_URL: http://localhost:8081
          VITE_KEYCLOAK_REALM: room-booking
          VITE_KEYCLOAK_CLIENT_ID: room-booking-frontend
        run: npm run build